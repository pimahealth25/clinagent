<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clinical Trials Chat</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/main.css') }}"
    />
    <script defer src="{{ url_for('static', filename='js/main.js') }}"></script>
  </head>
  <body>
    <div class="container">
      <h1>Clinical Trials Chat</h1>
      <div id="chat"></div>
      <div id="status" class="help"></div>
      <div class="row">
        <textarea
          id="input"
          placeholder="Type a query (e.g., phase 3 diabetes) or 'help'"
        ></textarea>
      </div>
      <div class="row" style="align-items: center; flex-wrap: wrap">
        <button id="send">Send</button>
        <button class="secondary" id="show">Show</button>
        <button class="secondary" id="clear">Clear Filters</button>
        <label
          style="
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #374151;
          "
        >
          <input type="checkbox" id="agent" /> Use Agents
        </label>
      </div>
      <div class="help">
        Commands: help • refine &lt;query&gt; • filter phase=&lt;v&gt; |
        status=&lt;v&gt; | condition=&lt;v&gt; • more • clear • show
      </div>
    </div>
  </body>
</html>
